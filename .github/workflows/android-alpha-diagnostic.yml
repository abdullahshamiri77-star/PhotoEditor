name: Android alpha blending diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-blending-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable and verify KVM access
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is missing on this runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM exists but is not readable and writable by the runner."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run alpha blending tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          script: |
            mkdir -p app/build/diagnostics && adb logcat -c && test_status=0; gradle connectedDebugAndroidTest || test_status=$?; adb logcat -d -v threadtime > app/build/diagnostics/emulator-logcat.txt 2>/dev/null || true; adb shell dumpsys activity exit-info com.photoeditor.test > app/build/diagnostics/test-process-exit-info.txt 2>/dev/null || true; adb shell dumpsys activity exit-info com.photoeditor > app/build/diagnostics/app-process-exit-info.txt 2>/dev/null || true; exit "$test_status"

      - name: Upload instrumentation reports and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-android-alpha-diagnostic
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/diagnostics/
          if-no-files-found: warn
